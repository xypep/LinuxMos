-- LinuxMos: große macOS-Desktop-Uhr
-- Leichtgewichtig: Update nur alle 5 s, keine Lua/Cairo-Zeichnungen.

conky.config = {
    update_interval = 5,
    total_run_times = 0,
    double_buffer = true,
    no_buffers = true,

    own_window = true,
    own_window_type = 'normal',
    own_window_class = 'Conky',
    own_window_title = 'linuxmos-clock',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_argb_visual = true,

    alignment = 'top_middle',
    gap_x = 0,
    gap_y = 110,
    minimum_width = 640,

    draw_borders = false,
    draw_outline = false,
    draw_shades = false,

    use_xft = true,
    font = 'Inter:size=12',
    default_color = 'f5f5f7',
    override_utf8_locale = true,
}

conky.text = [[
${alignc}${font Inter:style=Medium:size=20}${time %A, %e. %B}${font}
${voffset -14}${alignc}${font Inter:style=Bold:size=110}${time %H:%M}${font}
]]
